name: Refresh overseer snapshot

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 minutes (GitHub may delay this under load)
  workflow_dispatch:             # and on demand, e.g. right before a demo

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the snapshot
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: gitlab.nortal.com
          GITLAB_PROJECT: Anton.Zatkin/empis-overseer
        run: node scripts/fetch-snapshot.mjs

      - name: Verify nothing sensitive is in it
        run: node scripts/verify-snapshot.mjs data/overseer.json

      - name: Commit if it changed
        run: |
          git config user.name  "commit-o-meter bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first: on the very first run the file is untracked, and plain
          # `git diff` reports no change for untracked files.
          git add data/overseer.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi

          # Ignore generatedAt-only churn so quiet periods don't spam the history.
          changed=$(git diff --cached -U0 -- data/overseer.json \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'generatedAt' || true)
          if [ -z "$changed" ]; then
            echo "Only the timestamp moved; skipping commit."
            git restore --staged data/overseer.json
            exit 0
          fi

          git commit -m "Refresh overseer snapshot [skip ci]"
          git push
